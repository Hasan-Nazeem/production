services:
  client:
    image: 239155901548.dkr.ecr.ap-south-1.amazonaws.com/frontend:${IMAGE_TAG}
    container_name: client
    networks:
      - app-network

  server:
    image: 239155901548.dkr.ecr.ap-south-1.amazonaws.com/backend:${IMAGE_TAG}
    container_name: server
    env_file:
      - .env
    command: [
        'sh',
        '-c',
        'npm run seed:db admin@example.com admin123 && npm start'
      ]
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongodb
    command: mongod --quiet --logpath /dev/null
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
